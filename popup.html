<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shota</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand"><span class="mark">S</span><span>shota</span><span class="beta">BETA</span></header>
      <section class="intro"><p class="eyebrow" data-i18n="popupEyebrow">QUICK CAPTURE</p><h1><span data-i18n="popupTitleLine1">Pick a card.</span><br /><em data-i18n="popupTitleLine2">Share the moment.</em></h1><p class="sub" data-i18n="popupSubtitle">Hover any visible element on the page, then click to capture it at pixel-perfect resolution.</p></section>
      <button id="start" class="primary"><span class="crosshair">✦</span><span data-i18n="startSelecting">Start selecting</span><kbd>↵</kbd></button>
      <div class="tip"><span class="tip-icon">⌘</span><span><strong data-i18n="proTip">Pro tip</strong><br /><span data-i18n="cancelHint">Press Esc anytime to cancel.</span></span></div>
      <button id="shortcut-settings" class="shortcut-link" type="button"><span data-i18n="shortcutSettings">Set keyboard shortcut</span><span aria-hidden="true">↗</span></button>
      <footer><span data-i18n="version">v0.1 MVP</span><span class="dot"></span><span data-i18n="builtForWeb">Built for the web</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
